<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doge Clicker Beta v0.5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">

    <div class="left">
        <h1>🐕 Doge Clicker Beta v0.5</h1>

        <h2>Much Coin</h2>
        <div id="coinCount" class="coins">0</div>

        <h3>Doge Level: <span id="level">1</span></h3>

        <div class="progressContainer">
            <div id="progressBar" class="progressBar"></div>
        </div>

        <button id="dogeButton">
            <img src="doge.png" alt="Doge Coin">
        </button>
    </div>

    <div class="right">
        <h2>Doge Shop</h2>

        <button id="clickUpgrade" class="shopButton"></button>
        <button id="workerUpgrade" class="shopButton"></button>
        <button id="farmUpgrade" class="shopButton"></button>
        <button id="factoryUpgrade" class="shopButton"></button>
        <button id="bankUpgrade" class="shopButton"></button>

        <p>Much Coin per click: <span id="perClick">1</span></p>
        <p>Much Coin per second: <span id="perSecond">0</span></p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
